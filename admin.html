<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการรีวิว | Sinnika Shop</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf7ff;color:#49385e;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 60px}header,.panel,.item{background:white;border:1px solid #eadff5;border-radius:18px;padding:18px;margin:12px 0}h1,h2{color:#805db5;margin-top:0}input,textarea,select{width:100%;padding:11px;border:1px solid #ded1ec;border-radius:10px;font:inherit;margin:5px 0 12px}button{border:0;border-radius:10px;padding:10px 14px;margin:4px;background:#e8ddff;color:#4c3471;font:inherit;font-weight:700}button.primary{background:#bfa0f0}button.danger{background:#ffe0e8;color:#8a304d}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.small{color:#887a99;font-size:14px}.hidden{display:none}.item p{white-space:pre-wrap}.status{font-size:13px;color:#887a99}
</style></head><body><main class="wrap"><header><h1>Sinnika Shop — หลังบ้าน</h1><p class="small">หน้านี้ต้องล็อกอินด้วยบัญชี Supabase ที่ได้รับสิทธิ์ผู้ดูแล ห้ามแชร์ลิงก์สำหรับจัดการให้ผู้อื่น</p></header>
<section class="panel" id="loginPanel"><h2>เข้าสู่ระบบผู้ดูแล</h2><form id="loginForm"><label>อีเมล</label><input id="email" type="email" autocomplete="username" required><label>รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">เข้าสู่ระบบ</button><p id="loginMsg" class="small"></p></form></section>
<section class="panel hidden" id="adminPanel"><div class="row"><h2>จัดการรีวิว</h2><button id="logout">ออกจากระบบ</button></div><p id="adminMsg" class="small"></p><div id="items"></div></section>
<script>
const SUPABASE_URL="YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const configured=SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("YOUR_")&&SUPABASE_ANON_KEY.length>20&&!SUPABASE_ANON_KEY.includes("YOUR_");
const db=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id);
if(!db){$("loginMsg").textContent="กรุณาใส่ Supabase Project URL และ anon/public key ในไฟล์ admin.html ก่อน";}
async function isAdmin(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.from("shop_admins").select("user_id").eq("user_id",user.id).maybeSingle();return !!data&&!error;}
async function showState(){if(!db)return;const {data:{session}}=await db.auth.getSession();if(session&&await isAdmin()){$("loginPanel").classList.add("hidden");$("adminPanel").classList.remove("hidden");await loadReviews();}else{$("loginPanel").classList.remove("hidden");$("adminPanel").classList.add("hidden");}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();if(!db)return;$("loginMsg").textContent="กำลังเข้าสู่ระบบ…";const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("loginMsg").textContent="เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบอีเมลและรหัสผ่าน";return;}if(!(await isAdmin())){await db.auth.signOut();$("loginMsg").textContent="บัญชีนี้ไม่มีสิทธิ์ผู้ดูแล";return;}$("loginMsg").textContent="";await showState();});
$("logout").onclick=async()=>{await db.auth.signOut();await showState();};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function loadReviews(){const {data,error}=await db.from("shop_reviews").select("*").order("created_at",{ascending:false});if(error){$("adminMsg").textContent="โหลดรีวิวไม่ได้ กรุณาตรวจสอบสิทธิ์ฐานข้อมูล";return;}$("adminMsg").textContent=`ทั้งหมด ${data.length} รีวิว`; $("items").innerHTML=data.map(r=>`<article class="item" data-id="${r.id}"><strong>${esc(r.nickname)} (${esc(r.customer_name)})</strong><div>คะแนน: ${r.stars}/5 · <span class="status">${esc(r.status)}</span></div><p>${esc(r.comment||"ไม่มีความคิดเห็น")}</p>${r.photo_url?`<p><a href="${esc(r.photo_url)}" target="_blank" rel="noopener">ดูรูปแนบ</a></p>`:""}<label>สถานะ</label><select class="state"><option value="pending" ${r.status==="pending"?"selected":""}>รอตรวจสอบ</option><option value="published" ${r.status==="published"?"selected":""}>เผยแพร่</option><option value="rejected" ${r.status==="rejected"?"selected":""}>ไม่เผยแพร่</option></select><div class="row"><button class="primary save">บันทึกสถานะ</button><button class="danger delete">ลบรีวิว</button></div></article>`).join("");
document.querySelectorAll(".save").forEach(b=>b.onclick=async()=>{const el=b.closest(".item");const id=el.dataset.id;const status=el.querySelector(".state").value;const {error}=await db.from("shop_reviews").update({status}).eq("id",id);if(error){alert("บันทึกไม่สำเร็จ ตรวจสอบสิทธิ์ฐานข้อมูล");return;}await loadReviews();});
document.querySelectorAll(".delete").forEach(b=>b.onclick=async()=>{if(!confirm("ยืนยันลบรีวิวนี้หรือไม่?"))return;const el=b.closest(".item");const {error}=await db.from("shop_reviews").delete().eq("id",el.dataset.id);if(error){alert("ลบไม่สำเร็จ ตรวจสอบสิทธิ์ฐานข้อมูล");return;}await loadReviews();});}
if(db)showState();
</script></main></body></html>
